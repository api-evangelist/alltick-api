summary: >-
  AllTick publishes a full, self-serve price list in USDT (a stablecoin, not fiat) with no
  "contact sales" tier. Four capacity tiers (Free/Basic/Premium/Professional) sell a chosen basket
  of symbols; three market tiers sell an entire exchange's book. Symbol count, request rate,
  WebSocket connections and historical depth all scale together with price.
notes:
  - Prices are quoted per month in USDT.
  - >-
    The Free tier is not a time-limited trial of the paid product: it is a permanent tier locked to
    10 fixed demo symbols with end-of-day data only (no real-time candlesticks, no order book, no
    tick-by-tick). AllTick's FAQ separately describes a one-week free trial on registration.
  - Every tier's limits are mirrored in rate-limits/alltick-api-rate-limits.yml.
