summary: >-
  AllTick operates a status page and advertises a 99.95% SLA, but publishes no versioning policy, no
  deprecation policy, no changelog and no sunset commitments. There is no version segment in any URL
  and no version header, so a breaking change to the wire format has nowhere to be announced and no
  way to be opted out of. Nothing in the contract is marked deprecated.
versioning:
  scheme: none
  in_path: false
  in_header: false
  in_parameter: false
  spec_version: 1.0.0
  spec_version_source: openapi/alltick-api-openapi.json info.version
  policy_published: false
  note: >-
    /quote-stock-b-api and /quote-b-api name market families, not versions. The "b" is part of the
    service name, not a revision marker — the docs never describe an "a" predecessor.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No RFC 8594 Sunset or Deprecation header is documented or observed. No operation in the OpenAPI
    carries `deprecated: true`. The WebSocket docs DO record one capability that was considered and
    declined ("K-line push (not supported)"), which is an absence, not a deprecation.
