regulatory_context:
  entity: AllTick PTE. LTD.
  jurisdiction: Singapore
  note: >-
    Redistribution of exchange market data is normally governed by per-exchange licensing rather
    than by an API standard. AllTick's Terms of Service (https://alltick.co/terms) is the only
    document governing downstream use; no exchange licence attestations are published.
