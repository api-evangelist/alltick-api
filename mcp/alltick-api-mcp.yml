summary: >-
  AllTick ships no MCP server. No hosted/remote endpoint is published on any AllTick host, nothing
  in the docs, llms.txt or the two AllTick GitHub accounts mentions MCP, and the two npm packages
  that expose AllTick data over MCP are third-party or unverifiable (see packages/). The tools below
  are a CANDIDATE surface derived one-to-one from the 12 operations in AllTick's own OpenAPI 3.1.0 —
  they are a proposal to AllTick, not something an agent can call today.
