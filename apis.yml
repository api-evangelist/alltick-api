apis:
- name: AllTick REST/HTTP Query API
  description: 'Token-authenticated HTTPS query API for financial market tick data. Twelve operations
    across three base paths: /quote-stock-b-api for Hong Kong, US and A-share equities, /quote-b-api for
    forex, cryptocurrencies and commodities, and /api/suspension for SSE, NYSE and NASDAQ trading halts.
    Returns candlesticks (single and batch), latest trade price, order-book depth and equity static reference
    data. GET requests carry the whole request as a URL-encoded JSON document in a `query` parameter;
    responses use a {ret, msg, trace, data} envelope.'
  humanURL: https://apis.alltick.co/en
  baseURL: https://quote.alltick.co
