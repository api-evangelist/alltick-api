aid: alltick-api
name: AllTick API
description: AllTick (AllTick PTE. LTD., Singapore) sells real-time and historical financial market tick
  data through a token-authenticated HTTPS query API and two WebSocket streams, covering forex, Hong Kong
  / US / A-share equities, indices, precious metals, crude oil and cryptocurrencies across roughly 100,000
  symbols. The HTTP surface returns candlesticks (1-minute through monthly, with ex-rights and forward-adjusted
  variants), latest trade ticks, order-book depth, equity reference data and SSE/NYSE/NASDAQ trading-halt
  listings; the WebSocket surface pushes tick-by-tick trades and order-book updates. Sold self-serve in
  USDT on a per-symbol-basket or whole-market basis, with a permanent free tier limited to ten demo symbols.
  Built for exchanges, brokers, quantitative teams, trading platforms and fintech developers.
