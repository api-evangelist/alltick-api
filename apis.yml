- name: AllTick WebSocket Streaming API
  description: 'Token-authenticated WebSocket streaming API for real-time market data. Two endpoints —
    wss://quote.alltick.co/quote-stock-b-ws-api for equities and wss://quote.alltick.co/quote-b-ws-api
    for forex, crypto and commodities — carrying a numbered cmd_id protocol: subscribe to tick-by-tick
    trades (22004, pushed on 22998) or order-book depth (22002, pushed on 22999), cancel with 22006, and
    hold the connection open with a mandatory 10-second heartbeat (22000/22001). Candlesticks are not
    pushed; they are HTTP-only.'
  humanURL: https://en.apis.alltick.co/websocket-api/websocket-interface-api
  baseURL: wss://quote.alltick.co
